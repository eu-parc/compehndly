name: Run R Tests

permissions:
  contents: read

on:
  #pull_request:
  #  paths:
  #    - ".github/workflows/r-tests.yml"
  #    - "Makefile"
  #    - "R/**"
  #    - "shared/conformance/**"
  #push:
  #  branches: [main]
  #  paths:
  #    - ".github/workflows/r-tests.yml"
  #    - "Makefile"
  #    - "R/**"
  #    - "shared/conformance/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  r-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev libuv1-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: .r-lib
          key: ${{ runner.os }}-r-${{ hashFiles('R/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R dependencies
        run: make r-setup

      - name: Run R conformance tests
        run: make r-test
